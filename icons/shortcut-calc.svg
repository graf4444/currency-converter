  <rect x="123" y="80" width="21" height="18" rx="5" fill="#ff9f0a"/>
  <text x="133.5" y="94" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">÷</text>

  <!-- Row 2 -->
